name: fitflow_admin
description: FitFlow Admin Mobile — Flutter Edition
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.6.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Persistence
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # QR Scanner
  mobile_scanner: ^5.2.3

  # Environment
  flutter_dotenv: ^5.2.1

  # Localisation & formatting (pinned by flutter_localizations SDK)
  intl: ^0.20.0

  # UI Helpers
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.1.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/
